<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Parametric Surface Lab</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { margin:0; background:#05070d; color:white; font-family:system-ui; overflow:hidden;}
    #panel {position:fixed; top:16px; left:16px; background:rgba(0,0,0,0.7); padding:16px; border-radius:12px;}
  </style>
</head>
<body>
<div id="panel">
  <h3>Parametric Surface Lab</h3>
  <label>c <input id="c" type="range" min="0.2" max="5" step="0.1" value="2"></label><br>
  <label>u <input id="u" type="range" min="2" max="10" step="0.5" value="5"></label>
</div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
let scene=new THREE.Scene();
scene.background=new THREE.Color(0x05070d);

let camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,1000);
camera.position.set(8,-10,7);

let renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

let controls=new THREE.OrbitControls(camera,renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff,0.5));
let light=new THREE.DirectionalLight(0xffffff,1);
light.position.set(5,-5,8);
scene.add(light);

let mesh, wire;
let c=2, umax=5;

function build(){
  if(mesh) scene.remove(mesh);
  if(wire) scene.remove(wire);

  let g=new THREE.BufferGeometry();
  let v=[], idx=[];
  let us=60, vs=160;

  for(let i=0;i<=us;i++){
    let u=i/us*umax;
    for(let j=0;j<=vs;j++){
      let t=j/vs*Math.PI*2;
      let x=u*Math.cos(t);
      let y=u*Math.sin(t);
      let z=c*Math.sin(2*t);
      v.push(x,z,y);
    }
  }

  for(let i=0;i<us;i++){
    for(let j=0;j<vs;j++){
      let a=i*(vs+1)+j;
      let b=a+vs+1;
      idx.push(a,b,a+1,b,b+1,a+1);
    }
  }

  g.setAttribute("position",new THREE.Float32BufferAttribute(v,3));
  g.setIndex(idx);
  g.computeVertexNormals();

  mesh=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0x00b7ff,transparent:true,opacity:0.4,side:THREE.DoubleSide}));
  wire=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:0xffffff,wireframe:true}));

  scene.add(mesh);
  scene.add(wire);
}
build();

document.getElementById("c").oninput=e=>{c=e.target.value; build();}
document.getElementById("u").oninput=e=>{umax=e.target.value; build();}

function animate(){
  requestAnimationFrame(animate);
  mesh.rotation.z+=0.002;
  wire.rotation.z+=0.002;
  controls.update();
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
